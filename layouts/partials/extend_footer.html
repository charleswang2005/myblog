{{- if not (.Param "hideCustumFooter") }}
<footer class="footer">
<div>
<span id="site_pv">本站总访问量 <span id="pv_num">加载中…</span> 次</span>
</div>
<script>
(function(){
  var el=document.getElementById('pv_num');
  if(!el) return;
  fetch('/pv.json?t='+Date.now()).then(function(r){return r.json();}).then(function(d){
    if(d&&typeof d.pv==='number'){el.textContent=d.pv.toLocaleString('en-US');}
  }).catch(function(){el.textContent='—';});
})();
</script>
