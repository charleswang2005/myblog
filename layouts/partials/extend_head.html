<!-- Umami 页面阅读量（从 /pageviews.json 获取，当前访问 +1） -->
<script>
window.addEventListener('DOMContentLoaded', function() {
    var el = document.getElementById('page-views');
    if (!el) return;
    var path = decodeURIComponent(window.location.pathname);
    fetch('/pageviews.json', { cache: 'no-store' })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            var views = (data[path] || 0) + 1;
            el.textContent = views;
        })
        .catch(function() { el.textContent = '1'; });
});
</script>

<!-- 代码块复制按钮 -->
<script>
window.addEventListener('DOMContentLoaded', function() {
    document.querySelectorAll('pre').forEach(function(pre) {
        if (pre.querySelector('.copy-code')) return;
        var btn = document.createElement('span');
        btn.className = 'copy-code';
        btn.textContent = '复制';
        btn.addEventListener('click', function() {
            var code = pre.querySelector('code');
            if (!code) return;
            navigator.clipboard.writeText(code.textContent).then(function() {
                btn.textContent = '已复制';
                setTimeout(function() { btn.textContent = '复制'; }, 2000);
            });
        });
        pre.appendChild(btn);
    });
});
</script>

<!-- MathJax 公式渲染：仅当页面含公式($...$ 或 $$...$$)时才加载，避免无公式页面白等 -->
<script>
(function(){
  var html = document.documentElement.innerHTML;
  var hasMath = html.indexOf('$$') > -1 || /\$[^$]+\$/.test(html);
  if (!hasMath) return;
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    svg: { fontCache: 'global' }
  };
  var s = document.createElement('script');
  s.src = "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js";
  s.async = true;
  document.head.appendChild(s);
})();
</script>

<!-- 图片点击放大 lightbox（纯原生，无外部依赖） -->
<style>
.post-content img {
    display: block;
    margin: 1.2em auto;
    max-width: 100%;
    height: auto;
    border-radius: 6px;
    cursor: zoom-in;
}
.lightbox-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    cursor: zoom-out;
}
.lightbox-overlay.active { display: flex; }
.lightbox-overlay img {
    max-width: 92vw;
    max-height: 92vh;
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
    border-radius: 6px;
}
</style>
<script>
window.addEventListener('DOMContentLoaded', function () {
    var overlay = document.createElement('div');
    overlay.className = 'lightbox-overlay';
    var limg = document.createElement('img');
    overlay.appendChild(limg);
    document.body.appendChild(overlay);
    overlay.addEventListener('click', function () { overlay.classList.remove('active'); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') overlay.classList.remove('active');
    });
    document.querySelectorAll('.post-content img, .post-single img').forEach(function (im) {
        im.addEventListener('click', function (e) {
            e.stopPropagation();
            limg.src = im.src;
            overlay.classList.add('active');
        });
    });
});
</script>
