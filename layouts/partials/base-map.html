{{/* 所在地模块：腾讯地图 GL JS（合规国内源）+ CSS 灰白滤镜，复刻 mateng.world 的 BASE 样式 */}}
<div class="base-section">
  <p class="base-kicker">BASE</p>
  <h2 class="base-title">所在地。</h2>


  <div class="base-map-wrap">
    <div id="base-map"></div>
    <div class="base-map-blocker"></div>
    <span class="base-pin"></span>
    <div class="base-city-card">
      <span class="base-city-dot"></span>
      <span>
        <span class="base-city-name">图木舒克，中国</span>
        <span class="base-city-sub">Current City</span>
      </span>
    </div>
  </div>

  <div class="base-history">
    <span class="base-history-label">曾经居住过</span>
    <span class="base-pill">徐州</span>
  </div>
</div>

<style>
.base-section { margin: 2.5rem 0; }
.base-kicker {
  font-size: 12px; font-weight: 700; letter-spacing: .4em;
  color: #9a9a9a; text-transform: uppercase; margin: 0 0 14px;
}
.base-title {
  font-size: 2.4rem; font-weight: 800;
  color: var(--primary, #1a1a1a);
  margin: 0 0 16px; line-height: 1.1;
}

.base-map-wrap {
  position: relative; height: 420px;
  border-radius: 12px; overflow: hidden;
  background: #f2f0eb;
  border: 1px solid var(--border, #eee);
}
/* 灰白滤镜只加在地图画布上，蓝点和卡片放在滤镜层之外 */
#base-map {
  width: 100%; height: 100%;
  filter: grayscale(100%) brightness(1.07) contrast(.9);
}
.base-map-blocker { position:absolute; inset:0; z-index:5; }
.base-pin, .base-city-card { z-index:10; }
.base-pin {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 14px; height: 14px; border-radius: 50%;
  background: #3273dc; border: 3px solid #fff;
  box-shadow: 0 0 0 6px rgba(50,115,220,.28), 0 2px 6px rgba(0,0,0,.3);
  pointer-events: none;
  animation: base-pin-pulse 2s ease-out infinite;
}
@keyframes base-pin-pulse {
  0%   { box-shadow: 0 0 0 4px rgba(50,115,220,.30), 0 2px 6px rgba(0,0,0,.3); }
  70%  { box-shadow: 0 0 0 12px rgba(50,115,220,0),  0 2px 6px rgba(0,0,0,.3); }
  100% { box-shadow: 0 0 0 4px rgba(50,115,220,0),  0 2px 6px rgba(0,0,0,.3); }
}
.base-city-card {
  position: absolute; left: 14px; bottom: 14px;
  background: #fff; border-radius: 10px; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px;
  box-shadow: 0 6px 18px rgba(0,0,0,.14);
}
.base-city-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: #3273dc; flex: none;
}
.base-city-name { display: block; font-weight: 700; font-size: 15px; color: #222; }
.base-city-sub  { display: block; font-size: 12px; color: #8a8a8a; margin-top: 2px; }
.base-history { margin-top: 18px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.base-history-label { font-size: 13px; color: var(--secondary, #8a8a8a); }
.base-pill {
  background: var(--theme, #fff); color: var(--primary, #333);
  border: 1px solid var(--border, #e8e6e1);
  border-radius: 999px; padding: 6px 16px; font-size: 14px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05);
}
</style>

<script>
window.BASE_CFG = { lat: 39.8673, lng: 79.0770, zoom: 12 }; // 图木舒克市中心（GCJ-02），可微调
</script>
<script src="https://map.qq.com/api/gljs?v=1.exp&key=AQGBZ-T75ET-NL4XT-V2E5W-P77VJ-IWBO7"></script>
<script>
(function () {
  function init() {
    if (typeof TMap === 'undefined') return; // key 未替换 / SDK 加载失败时静默降级，不影响页面其余部分
    var el = document.getElementById('base-map');
    if (!el) return;
    var c = window.BASE_CFG;
    new TMap.Map(el, {
      center: new TMap.LatLng(c.lat, c.lng),
      zoom: c.zoom,
      draggable: false,
      scrollwheel: false,
      doubleClickZoom: false
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else { init(); }
})();
</script>
