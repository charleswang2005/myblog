{{/* 宠物模块：3 只宠物，复刻 mateng.world 的 BASE 风格 */}}
<div class="base-section">
  <p class="base-kicker">PET</p>
  <h2 class="base-title">家人。</h2>

  <div class="pet-grid">
    <div class="pet-wrap">
      <img class="pet-photo" src="https://charleswang.top/oss/pet/pet1.jpg" alt="宠物1">
      <div class="pet-caption">
        <span class="pet-name">名字1</span>
        <span class="pet-sub">一句话</span>
      </div>
    </div>
    <div class="pet-wrap">
      <img class="pet-photo" src="https://charleswang.top/oss/pet/pet2.jpg" alt="宠物2">
      <div class="pet-caption">
        <span class="pet-name">名字2</span>
        <span class="pet-sub">一句话</span>
      </div>
    </div>
    <div class="pet-wrap">
      <img class="pet-photo" src="https://charleswang.top/oss/pet/pet3.jpg" alt="宠物3">
      <div class="pet-caption">
        <span class="pet-name">名字3</span>
        <span class="pet-sub">一句话</span>
      </div>
    </div>
  </div>
</div>

<style>
.pet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
@media (max-width: 640px) { .pet-grid { grid-template-columns: 1fr; } }
.pet-wrap {
  position: relative; border-radius: 12px; overflow: hidden;
  border: 1px solid var(--border, #eee); background: #f2f0eb;
  aspect-ratio: 1 / 1;
}
.pet-photo { width: 100%; height: 100%; object-fit: cover; display: block; }
.pet-caption {
  position: absolute; left: 10px; bottom: 10px;
  background: #fff; border-radius: 10px; padding: 8px 14px;
  box-shadow: 0 6px 18px rgba(0,0,0,.14);
}
.pet-name { display: block; font-weight: 700; font-size: 14px; color: #222; }
.pet-sub  { display: block; font-size: 11px; color: #8a8a8a; margin-top: 2px; }
</style>
