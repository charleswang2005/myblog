{{- if not (.Param "hideCustumFooter") }}
<footer class="footer">
  {{- if site.Copyright }}
  <span>{{ site.Copyright | markdownify }}</span>
  {{- else }}
  <span>&copy; {{ now.Year }} <a href="{{ "" | absLangURL }}">{{ site.Title }}</a></span>
  {{- end }}

  <span>
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">苏ICP备2026014105号-1</a>
    &nbsp;
    <a href="http://www.beian.gov.cn/portal/registerSystemInfo?recordcode=32032102000497" target="_blank" rel="noopener noreferrer">苏公网安备32032102000497号</a>
  </span>

  <span>
    Powered by
    <a href="https://gohugo.io/" rel="noopener noreferrer" target="_blank">Hugo</a> &
    <a href="https://github.com/adityatelange/hugo-PaperMod/" rel="noopener" target="_blank">PaperMod</a>
  </span>
  {{ if .Site.Params.busuanzi.enable -}}
  <div>
  <span id="busuanzi_container_site_pv">
    本站总访问量<span id="busuanzi_value_site_pv"></span>次
  </span>
</div>
  {{- end -}}
</footer>
{{- end }}
