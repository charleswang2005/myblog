baseURL: https://charleswang.top/
languageCode: zh-cn
title: CharlesWang
theme: ["PaperMod"]

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\\[', '\\]']]
          inline: [['$', '$'], ['\\(', '\\)']]

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - name: 🔍搜索
      url: /search
      weight: 1
    - name: 🏷️标签
      url: /tags
      weight: 2
    - name: 📦归档
      url: /archive
      weight: 3
    - name: 🔗友链
      url: /links
      weight: 4

params:
  busuanzi:
    enable: true
  hideFooter: true
  ShowToc: true
  TocOpen: true
