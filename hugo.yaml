baseURL: https://charleswang.top/
languageCode: zh-cn
title: CharlesWang个人博客
hasCJKLanguage: true
theme: ["PaperMod"]

frontmatter:
  lastmod:
    - :git
    - lastmod
    - date
    - :fileModTime

enableGitInfo: true

markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['$$', '$$'], ['\\[', '\\]']]
          inline: [['$', '$'], ['\\(', '\\)']]

outputs:
  home:
    - HTML
    - RSS
    - JSON

menu:
  main:
    - name: 🔍搜索
      url: /search
      weight: 1
    - name: 🏷️标签
      url: /tags
      weight: 2
    - name: 📦归档
      url: /archive
      weight: 3
    - name: 🔗友链
      url: /links
      weight: 4
    - name: 👤关于
      url: /about
      weight: 5

params:
  description: "CharlesWang 的个人博客 - 记录技术、生活与思考"
  author: "CharlesWang"
  keywords: ["博客", "CharlesWang", "技术", "个人博客"]
  busuanzi:
    enable: true
  hideFooter: true
  ShowToc: true
  TocOpen: true
  comments: true
  profileMode:
    enabled: true
    title: "CharlesWang"
    subtitle: "👋你好呀 欢迎来访"
    imageUrl: "https://charleswang.top/oss/blog/avatar.jpg"
    imageWidth: 180
    imageHeight: 180
    imageTitle: "avatar"
    buttons:
      - name: 归档
        url: /archive
      - name: 标签
        url: /tags
      - name: 友链
        url: /links
  socialIcons:
    - name: github
      url: "https://github.com/charleswang2005"
    - name: email
      url: "mailto:charleswang2005@gmail.com"
    - name: rss
      url: "/index.xml"
    - name: douban
      url: "https://www.douban.com/people/281172188/?_i=67067519zH6cxv"
