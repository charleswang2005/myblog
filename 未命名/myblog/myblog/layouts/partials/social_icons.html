<div class="social-icons" {{ with .align}}align="{{.}}" {{- end }}>
    {{- range site.Params.socialIcons }}
    <a href="{{ trim .url " " | safeURL }}" target="_blank" rel="noopener noreferrer me"
        title="{{ (.title | default .name) | title }}">
        {{- if eq (trim .name " " | lower) "douban" -}}
        <span class="social-douban-glyph" style="display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;font-weight:700;font-size:1rem;line-height:1;border:1px solid currentColor;border-radius:4px;">豆</span>
        {{- else -}}
        {{ partial "svg.html" . }}
        {{- end -}}
    </a>
    {{- end }}
</div>
